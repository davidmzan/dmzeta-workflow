<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dmzeta Workflow</title>
<style>
:root{--bg:#06060b;--p1:rgba(255,255,255,.045);--p2:rgba(255,255,255,.075);--line:rgba(255,255,255,.09);--txt:#f5f5fa;--mut:#9a9aae;--dim:#6b6b80;
--acc:#7c5cff;--acc2:#22d3ee;--pink:#ff3d8b;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:16px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 500px at 8% -10%,rgba(124,92,255,.22),transparent 60%),
 radial-gradient(800px 500px at 100% 0%,rgba(34,211,238,.13),transparent 60%),
 radial-gradient(700px 500px at 50% 120%,rgba(255,61,139,.12),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box;border:2px solid transparent}
#app{display:grid;grid-template-rows:64px minmax(0,1fr) 372px;height:100vh;gap:12px;padding:0 16px 16px}
.glass{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

/* header */
.hdr{display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:12px;min-width:250px}
.eq{display:flex;gap:3px;align-items:flex-end;height:26px}
.eq i{width:4px;border-radius:2px;background:linear-gradient(180deg,var(--acc2),var(--acc));animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){height:40%;animation-delay:-.2s}.eq i:nth-child(2){height:90%;animation-delay:-.5s}.eq i:nth-child(3){height:60%;animation-delay:-.8s}.eq i:nth-child(4){height:100%;animation-delay:-.1s}.eq i:nth-child(5){height:50%;animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.eq{transform-origin:bottom}.eq i{transform-origin:bottom}
.logo b{font-size:20px;letter-spacing:-.4px;font-weight:700;background:linear-gradient(90deg,#fff,#c9bfff 55%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;color:var(--dim);font-size:10px;letter-spacing:2.2px;text-transform:uppercase;margin-top:1px}
.steps{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.step{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--line);background:var(--p1);color:var(--mut);transition:.25s}
.step em{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.08)}
.step.on{color:#fff;border-color:rgba(124,92,255,.7);background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.15));box-shadow:0 0 24px rgba(124,92,255,.35)}
.step.on em{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.step.done{color:var(--ok);border-color:rgba(52,211,153,.4)}.step.done em{background:rgba(52,211,153,.2);color:var(--ok)}
.sep{width:22px;height:1px;background:var(--line)}
.acts{display:flex;align-items:center;gap:10px;min-width:250px;justify-content:flex-end}
.btn{padding:9px 16px;border-radius:12px;background:var(--p2);border:1px solid var(--line);font-weight:600;transition:.18s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#5a7bff 60%,var(--acc2));border:0;box-shadow:0 6px 26px rgba(124,92,255,.45);color:#fff}
.btn.pri:hover{filter:brightness(1.12);box-shadow:0 8px 34px rgba(124,92,255,.65)}
.btn.sm{padding:6px 11px;border-radius:9px;font-size:12px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}
.fstat{padding:6px 14px 0;font-size:12px;color:var(--mut);min-height:0}.fstat b{color:#fff}.fstat .ok{color:#34d399}.fstat .pe{color:#fbbf24}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);transition:.18s}.ico:hover{background:rgba(255,255,255,.13)}

/* main */
.main{display:grid;grid-template-columns:minmax(440px,45%) minmax(0,1fr);gap:12px;min-height:0}
.crate,.insp{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{padding:6px 10px;border-radius:999px;color:var(--mut);border:1px solid transparent;font-weight:600;font-size:12px;transition:.15s}
.pill:hover{color:#fff}.pill.on{color:#fff;background:var(--p2);border-color:var(--line)}
.pill b{opacity:.6;margin-left:5px;font-weight:600}
.search{margin-left:auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:7px 11px;width:120px;min-width:0;outline:none}
.search:focus{border-color:var(--acc)}
.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.card{display:grid;grid-template-columns:26px 50px minmax(0,1fr) auto 46px;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--p1);border:1px solid var(--line);cursor:pointer;transition:.18s;position:relative}
.card:hover{background:var(--p2);transform:translateX(2px)}
.card.sel{background:linear-gradient(135deg,rgba(124,92,255,.26),rgba(34,211,238,.10));border-color:rgba(124,92,255,.8);box-shadow:0 0 0 1px rgba(124,92,255,.5),0 10px 34px rgba(124,92,255,.25)}
.card.off{opacity:.5}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:13px;transition:.15s}
.chk.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 0 14px rgba(124,92,255,.6)}
.key{height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0b0b10;letter-spacing:.3px}
.key small{display:block;font-size:8px;font-weight:700;opacity:.65;margin-top:-2px;text-align:center}
.ttl{font-weight:700;font-size:14px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;letter-spacing:-.2px;line-height:1.25}
.ttl .p-m{color:#ff9ec6}.ttl .p-b{color:#93c5fd}.ttl .p-a{color:#fcd34d}.ttl .p-k,.ttl .p-n{color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:210px}
.chip{padding:3px 8px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.6px;white-space:nowrap;border:1px solid transparent}
.c-bars{background:rgba(255,255,255,.1);color:#fff}
.c-POE{background:rgba(59,130,246,.22);color:#93c5fd;border-color:rgba(59,130,246,.5)}
.c-MOE{background:rgba(255,61,139,.2);color:#ff9ec6;border-color:rgba(255,61,139,.5)}
.c-FME{background:rgba(168,85,247,.22);color:#d8b4fe;border-color:rgba(168,85,247,.5)}
.c-dup{background:rgba(248,113,113,.2);color:#fca5a5;border-color:rgba(248,113,113,.55)}
.c-warn{background:rgba(251,191,36,.16);color:#fcd34d;border-color:rgba(251,191,36,.45)}
.c-info{background:rgba(34,211,238,.14);color:#67e8f9;border-color:rgba(34,211,238,.4)}
.c-tag{background:rgba(255,255,255,.07);color:#d6d6e4}
.ring{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#10101a}
.ring span{position:relative}
.seen{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* inspector */
.insp{padding:18px 20px;overflow:auto;gap:16px}
.lbl{font-size:10px;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase;font-weight:700;margin-bottom:7px}
.fld{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:15px;font-weight:600;transition:.15s}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.fld.big{font-size:21px;font-weight:700;letter-spacing:-.4px;padding:14px 16px}
.orig{color:var(--dim);font-size:11px;margin-top:6px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-family:var(--mono);font-size:13.5px;padding:13px 15px;border-radius:12px;background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(34,211,238,.07));border:1px solid rgba(124,92,255,.35);word-break:break-word;line-height:1.55}
.preview .p-m{color:#ff9ec6}.preview .p-b{color:#93c5fd}.preview .p-a{color:#fcd34d}.preview .p-k{color:#6ee7b7}.preview .p-n{color:#67e8f9}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tg{display:flex;gap:7px;flex-wrap:wrap}
.tgb{padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--p1);color:var(--mut);font-weight:700;font-size:12px;transition:.15s}
.tgb:hover{color:#fff;background:var(--p2)}
.tgb.on{color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.5),rgba(34,211,238,.25));border-color:rgba(124,92,255,.8);box-shadow:0 0 16px rgba(124,92,255,.35)}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 15px;border-radius:9px;color:var(--mut);font-weight:700;transition:.15s}
.seg button:hover{color:#fff}.seg button.on{background:linear-gradient(135deg,var(--acc),#5a7bff);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.5)}
.seg.t button.on[data-v=POE]{background:linear-gradient(135deg,#2563eb,#3b82f6)}.seg.t button.on[data-v=MOE]{background:linear-gradient(135deg,#db2777,var(--pink))}.seg.t button.on[data-v=FME]{background:linear-gradient(135deg,#7e22ce,#a855f7)}
.flags{display:flex;flex-direction:column;gap:7px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--p1);border:1px solid var(--line);font-size:12.5px;color:#d9d9e6;line-height:1.4}
.flag i{font-style:normal;width:20px;text-align:center}
.flag.bad{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08)}.flag.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07)}.flag.good{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.07)}
.empty{margin:auto;text-align:center;max-width:430px;padding:30px}
.empty .eq{height:54px;justify-content:center;margin-bottom:20px}.empty .eq i{width:7px}
.empty h2{font-size:26px;letter-spacing:-.6px;margin-bottom:10px}
.empty p{color:var(--mut);line-height:1.6;margin-bottom:22px}
.empty .btn{margin:0 5px}
.mini{color:var(--dim);font-size:11.5px;margin-top:14px}

/* deck */
.deck{padding:14px 16px 14px;display:grid;grid-template-rows:auto 40px minmax(0,1fr) auto;gap:10px;position:relative;min-height:0}
.dtop{display:flex;align-items:center;gap:14px}
.dname{font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.badge{padding:4px 10px;border-radius:8px;font-family:var(--mono);font-weight:700;font-size:12px;background:rgba(255,255,255,.09)}
.read{margin-left:auto;display:flex;gap:18px;align-items:baseline;font-family:var(--mono)}
.read b{font-size:22px;font-weight:700;letter-spacing:-.5px}.read span{color:var(--mut);font-size:12px}
.wfwrap{position:relative;min-height:120px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.4);border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
#wf{cursor:crosshair}
.ovwrap{border-radius:10px;overflow:hidden;background:rgba(0,0,0,.4);border:1px solid var(--line);cursor:pointer}
.wfmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:600;background:rgba(6,6,11,.55);backdrop-filter:blur(3px);z-index:2}
.shim{background:linear-gradient(90deg,transparent,rgba(124,92,255,.25),transparent);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.ctrl{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px;padding:0 14px 0 0;border-right:1px solid var(--line)}
.grp:last-of-type{border:0}
.tbtn{height:36px;min-width:36px;padding:0 12px;white-space:nowrap;border-radius:11px;background:var(--p2);border:1px solid var(--line);font-weight:700;font-size:12px;transition:.15s;display:grid;place-items:center}
.tbtn:hover{background:rgba(255,255,255,.14)}.tbtn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;box-shadow:0 0 18px rgba(124,92,255,.5)}
.play{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;box-shadow:0 8px 28px rgba(124,92,255,.55);font-size:20px;color:#fff;display:grid;place-items:center;transition:.15s}
.play:hover{transform:scale(1.06)}
.mk{height:36px;padding:0 12px;border-radius:11px;font-weight:800;font-size:11px;letter-spacing:.5px;border:1px solid;transition:.15s}
.mk.s{color:#fdba74;border-color:rgba(251,146,60,.55);background:rgba(251,146,60,.1)}.mk.e{color:#fca5a5;border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.1)}.mk.l{color:#f9a8d4;border-color:rgba(236,72,153,.55);background:rgba(236,72,153,.1)}
.mk:hover{filter:brightness(1.4)}.mk.on{color:#0b0b14 !important;box-shadow:0 0 16px rgba(255,255,255,.25)}.mk.s.on{background:#fb923c}.mk.e.on{background:#f87171}.mk.l.on{background:#f472b6}
.pads{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-left:auto}
.pad{width:68px;height:44px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-weight:800;transition:.15s;line-height:1.1}
.pad small{font-size:9.5px;font-weight:600;opacity:.85;font-family:var(--mono)}
.pad.on{color:#06060b;border-color:transparent;box-shadow:0 0 18px var(--pc)}
.pad:hover{transform:translateY(-2px)}
.pal.mem{grid-template-columns:1fr;width:320px;max-height:320px;overflow:auto;right:auto;left:0}.mrow{display:flex;gap:6px;align-items:center}.mrow input{flex:1;min-width:0;height:30px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;padding:0 8px}.mrow small{font-family:var(--mono);color:var(--mut);width:46px}.mrow button{height:28px;min-width:28px;border-radius:8px;background:var(--p2)}
.padcol{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}.padcol .pads{margin-left:0;grid-template-columns:repeat(8,98px);gap:8px;width:auto}.padcol .pad{width:98px;height:46px;font-size:14px}.padcol .pad small{font-size:10px}.padcol .mpads .pad{height:38px;font-size:10px;letter-spacing:.2px;border-radius:9px;white-space:normal;line-height:1.1;padding:2px 5px;word-break:break-word;overflow:hidden}.ctrl .ptools{display:flex;gap:8px;align-items:center;margin-left:auto;align-self:flex-start;flex-wrap:wrap;justify-content:flex-end}
.pal.m .pm-h{grid-column:1/-1;font-size:11px;color:var(--mut);margin-bottom:2px}.pal.m input{grid-column:1/-1;height:30px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;padding:0 8px;margin-bottom:4px}.mpads .pad.sel{outline:2px solid #fff;outline-offset:1px}
.ccol{position:relative}#memDot,#cDot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;background:#a5e116}.pal{position:absolute;bottom:44px;right:0;display:none;grid-template-columns:repeat(6,28px);gap:6px;padding:10px;border-radius:14px;background:#14141f;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:20}.pal.show{display:grid}.sw{width:28px;height:28px;border-radius:8px;border:2px solid transparent;font-size:10px;font-weight:800;color:#fff}.sw.on{border-color:#fff}
.kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.1);color:var(--mut);margin-left:6px}

/* toast, modal, drawer */
#toast{position:fixed;left:22px;bottom:22px;width:360px;padding:14px 16px;border-radius:14px;background:rgba(18,18,28,.92);border:1px solid var(--line);backdrop-filter:blur(20px);box-shadow:0 18px 50px rgba(0,0,0,.6);transform:translateY(140%);transition:.35s cubic-bezier(.2,.9,.2,1);z-index:50}
#toast.show{transform:none}
#toast b{display:block;font-size:13px;margin-bottom:8px}
#toast .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
#toast .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#toast .bar.ind i{width:40%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
#toast p{color:var(--mut);font-size:11.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
#toast.err{border-color:rgba(248,113,113,.6)}
.scrim{position:fixed;inset:0;background:rgba(2,2,6,.66);backdrop-filter:blur(6px);display:none;place-items:center;z-index:60}
.scrim.show{display:grid}
.modal{width:min(520px,92vw);max-height:84vh;overflow:auto;padding:24px;border-radius:20px;background:rgba(20,20,32,.96);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.7)}
.modal h3{font-size:19px;letter-spacing:-.4px;margin-bottom:10px}
.modal .body{color:#cfcfe0;line-height:1.6;white-space:pre-wrap;font-size:13px}
.modal .ft{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:96vw;background:rgba(14,14,22,.97);border-left:1px solid var(--line);backdrop-filter:blur(24px);transform:translateX(104%);transition:.35s cubic-bezier(.2,.9,.2,1);z-index:70;padding:24px;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.drawer.show{transform:none}
.drawer h3{font-size:20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.sec{padding:15px 0;border-top:1px solid var(--line)}
.sec h4{font-size:11px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.sec p{color:var(--mut);font-size:12px;line-height:1.55;margin-bottom:10px}
.path{font-family:var(--mono);font-size:11px;color:#cfcfe0;background:rgba(0,0,0,.3);border:1px solid var(--line);padding:8px 10px;border-radius:9px;margin-bottom:8px;word-break:break-all}
.switch{width:44px;height:25px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}.switch.on::after{left:22px}
.line{display:flex;justify-content:space-between;align-items:center;gap:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;color:var(--mut)}

.zoomc{position:absolute;right:8px;top:28px;display:flex;gap:4px;z-index:3}
.zb{height:24px;min-width:26px;padding:0 8px;border-radius:7px;background:rgba(10,10,18,.75);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mut);backdrop-filter:blur(8px)}.zb:hover{color:#fff;background:rgba(40,40,60,.9)}
.gl{font-size:9px;letter-spacing:1.6px;color:var(--dim);font-weight:800;margin-right:2px;writing-mode:horizontal-tb}
.tbtn.c{min-width:0;padding:0 9px;font-size:11px}
.mk{padding:0 11px}
.pad{width:54px;height:42px}.pads{gap:6px}
.ctrl{gap:8px 12px}.grp{padding-right:12px}
.insp{padding:14px 18px;gap:13px}.fld.big{font-size:19px;padding:11px 14px}.fld{padding:10px 12px;font-size:14px}

</style>

<body>
<div id="app">
  <header class="hdr">
    <div class="logo"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div><b>Dmzeta Workflow</b><small>Prep · Cues · Library</small></div></div>
    <div class="steps" id="steps">
      <div class="step" data-s="1"><em>1</em>Analizar</div><div class="sep"></div>
      <div class="step" data-s="2"><em>2</em>Revisar</div><div class="sep"></div>
      <div class="step" data-s="3"><em>3</em>Aplicar</div><div class="sep"></div>
      <div class="step" data-s="4"><em>4</em>Cues</div>
    </div>
    <div class="acts">
      <button class="ico" id="bUndo" title="Deshacer última tanda" style="display:none">↶</button>
      <button class="ico" id="bSet" title="Ajustes">⚙</button>
      <button class="btn pri" id="bCta">Elegir carpeta</button>
    </div>
  </header>

  <div class="main">
    <section class="crate glass">
      <div class="fstat" id="fstat"></div>
      <div class="tb" id="filters"></div>
      <div class="tb" id="bulk" style="padding-top:0"></div>
      <div class="list" id="list"></div>
    </section>
    <section class="insp glass" id="insp"></section>
  </div>

  <section class="deck glass" id="deck">
    <div class="dtop">
      <div class="dname" id="dName">Sin pista seleccionada</div>
      <span class="badge" id="dKey" style="display:none"></span><span class="badge" id="dBpm" style="display:none"></span>
      <div class="read"><b id="dTime">0:00.0</b><span id="dBar">COMPÁS —</span></div>
    </div>
    <div class="ovwrap"><canvas id="ov"></canvas></div>
    <div class="wfwrap"><canvas id="wf"></canvas><div class="zoomc"><button class="zb" id="tZm" title="Alejar (−)">−</button><button class="zb" id="tZp" title="Acercar (+)">+</button><button class="zb" id="tFit" title="Ver toda la pista">TODO</button></div><div class="wfmsg" id="wfMsg" style="display:none"></div></div>
    <div class="ctrl">
      <div class="grp">
        <button class="tbtn" id="tStart" title="Ir al primer beat">⏮</button>
        <button class="play" id="tPlay" title="Reproducir / pausa (Espacio)">▶</button>
        <button class="tbtn" id="tCut" title="Ir al corte del extender">CORTE</button>
        <button class="tbtn on" id="tClk" title="Clic en cada compás (M)">CLICS</button>
        <button class="tbtn on" id="tQ" title="Quantize (Q): el cursor salta al beat más cercano. Apágalo para moverte libre.">QUANTIZE</button>
        <button class="tbtn" id="tMk" title="Marca de reproducción (K). Al ponerla suena desde ella y Espacio vuelve a ella. Pulsa otra vez para quitarla y tocar desde el cursor. Si pulsas un cue, suena desde el cue.">📍 MARCA</button>
      </div>
      <div class="grp"><span class="gl">GRID</span>
        <button class="tbtn c" id="gDrag" title="Arrastrar el grid con el ratón sobre la onda (Shift+arrastrar también)">✋ ARRASTRAR</button>
        <button class="tbtn c" id="gMm" title="Grid atrás los ms indicados ( , )">◂ ms</button><input id="gStep" type="number" min="1" max="500" step="1" value="5" title="Milisegundos por paso (1 a 500)" style="width:52px;height:36px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;text-align:center;font-weight:700"><button class="tbtn c" id="gMp" title="Grid adelante los ms indicados ( . )">ms ▸</button>
        <button class="tbtn c" id="gR" title="Volver al grid y BPM detectados">↺</button><button class="tbtn c" id="gRe" title="Reanalizar el grid de esta pista desde cero (ignora lo guardado y la caché)">⟳ REANALIZAR</button>
      </div>
      <div class="grp"><span class="gl">BPM</span><input id="bpmIn" type="number" step="0.01" min="40" max="240" title="Rueda del ratón encima: ±0,01 (Shift ±0,1 · Alt ±0,001). También puedes escribirlo." style="width:92px;height:36px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;text-align:center;font-weight:700;cursor:ns-resize"></div>
      <div class="padcol">
        <div class="pads" id="pads"></div>
        <div class="pads mpads" id="mpads" title="Memory cues. Clic: saltar (o ponerlo en el cursor si está vacío) · Shift+clic o clic derecho: quitarlo · doble clic en uno libre: ponerle nombre"></div>

      </div>
      <div class="ptools">
          <div class="ccol"><button class="tbtn c" id="cColBtn" title="Cambiar el color del hot cue C (si el detectado no es el correcto)"><i id="cDot"></i>COLOR C</button><div class="pal" id="pal"></div></div>
          <div class="ccol"><button class="tbtn c" id="memCol" title="Editar nombre y color del memory cue seleccionado (clic en un memory cue para seleccionarlo; doble clic también abre esto)"><i id="memDot"></i>EDITAR MEMORY</button><div class="pal m" id="palM"></div></div>
          <span class="gl">LOOP</span><select id="lLen" class="tbtn c" title="Duración del loop final en compases"><option value="1">1 comp.</option><option value="2">2 comp.</option><option value="4">4 comp.</option><option value="8" selected>8 comp.</option><option value="16">16 comp.</option><option value="32">32 comp.</option></select>
        </div>
    </div>
  </section>
</div>

<div id="toast"><b id="tT">Trabajando…</b><div class="bar" id="tB"><i></i></div><p id="tL"></p></div>
<div class="scrim" id="scrim"><div class="modal glass"><h3 id="mT"></h3><div class="body" id="mB"></div><div class="ft" id="mF"></div></div></div>
<aside class="drawer" id="drawer"></aside>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent, DEMO=location.search.includes('demo');
const S={folder:'',rows:[],sel:-1,filter:'all',q:'',cfg:{train:[],xml:'',folder:'',backup:true,auto_learn:true,auto_n:10},st:{},step:1,marks:{},done:{apply:false,cues:false},saveT:null};
const D={loopLen:8,q:true,gm:false,cuePt:null,buf:null,peaks:null,sr:44100,dur:0,t0:0,t0det:0,bpm:0,view:[0,10],pos:0,playing:false,ctx:null,src:null,startedAt:0,clicks:true,loading:false,cache:new Map(),name:null,raf:0,nextBar:0,timer:null,drag:null,gen:0};

/* ───────── nombre: mismo formato que tu biblioteca ───────── */
function parseName(n){
  let s=n.replace(/\.(mp3|m4a|flac|wav|aiff?)$/i,''),key=null,bpm=null,m=s.match(/\s*-\s*(\d{1,2}[AB])\s*-\s*(\d+)\s*$/);
  if(m){key=m[1];bpm=+m[2];s=s.slice(0,m.index);}
  const o={mashup:/\(Mashup\)/.test(s),open_show:/\(Open Show\)/.test(s),bars:null,type:null,aca_starter:/\(Aca Starter\)/.test(s),after:null,short_edit:/\(Short Edit\)/.test(s),aca_out:/\(Aca Out\)/.test(s),key,bpm};
  const mb=s.match(/\((\d+) Bars (POE|MOE|FME)\)/); if(mb){o.bars=+mb[1];o.type=mb[2];}
  const ma=s.match(/\((In Aca|In Hype)\)/); if(ma)o.after=ma[1];
  o.base=s.replace(/\s*\((?:Mashup|Open Show|\d+ Bars (?:POE|MOE|FME)|Aca Starter|In Aca|In Hype|Short Edit|Aca Out)\)/g,'').trim();
  return o;
}
function buildName(p){
  let s=p.base||''; if(p.mashup)s+=' (Mashup)'; if(p.open_show)s+=' (Open Show)'; if(p.aca_starter)s+=' (Aca Starter)'; else if(p.bars&&p.type)s+=` (${p.bars} Bars ${p.type})`;
  if(p.after)s+=` (${p.after})`; if(p.short_edit)s+=' (Short Edit)'; if(p.aca_out)s+=' (Aca Out)'; return `${s} - ${p.key} - ${Math.round(p.bpm)}`;
}
const finalOf=r=>(r.p.key&&r.p.bpm&&r.p.base)?buildName(r.p):'';
function previewHTML(r){
  const p=r.p; let h=`<span>${esc(p.base)}</span>`;
  if(p.mashup)h+=` <span class="p-m">(Mashup)</span>`; if(p.open_show)h+=` <span class="p-a">(Open Show)</span>`; if(p.aca_starter)h+=` <span class="p-b">(Aca Starter)</span>`; else if(p.bars&&p.type)h+=` <span class="p-b">(${p.bars} Bars ${p.type})</span>`;
  if(p.after)h+=` <span class="p-a">(${p.after})</span>`; if(p.short_edit)h+=` <span class="p-a">(Short Edit)</span>`; if(p.aca_out)h+=` <span class="p-m">(Aca Out)</span>`;
  return h+` <span class="p-k">- ${esc(p.key||'?')}</span> <span class="p-n">- ${p.bpm?Math.round(p.bpm):'?'}</span>`;
}
function keyBadge(k){const m=/^(\d+)([AB])$/.exec(k||'');if(!m)return{bg:'#3a3a48',t:'—'};const h=(parseInt(m[1])*30+150)%360,a=m[2]==='A';return{bg:`linear-gradient(135deg,hsl(${h} 90% ${a?58:72}%),hsl(${(h+30)%360} 90% ${a?46:60}%))`,t:k};}

/* ───────── API (con modo demo) ───────── */
async function api(path,body){
  if(DEMO) return demoApi(path,body);
  const r=await fetch(path,body!==undefined?{method:'POST',body:JSON.stringify(body)}:{}); return r.json();
}
async function runJob(title,id,onDone){
  const t=$('#toast'),T=$('#tT'),B=$('#tB'),L=$('#tL'); t.classList.remove('err'); t.classList.add('show'); T.textContent=title+'…'; B.classList.add('ind'); B.firstElementChild.style.width=''; L.textContent='';
  for(;;){
    const j=await api('/api/job?id='+id);
    if(j.log&&j.log.length)L.textContent=j.log[j.log.length-1];
    if(j.progress!=null){B.classList.remove('ind');B.firstElementChild.style.width=Math.round(j.progress*100)+'%';T.textContent=`${title}… ${Math.round(j.progress*100)}%`;}
    if(j.status==='done'){T.textContent=title+' ✓';B.classList.remove('ind');B.firstElementChild.style.width='100%';setTimeout(()=>t.classList.remove('show'),1800);return onDone&&onDone(j);}
    if(j.status==='error'||j.status==='missing'){t.classList.add('err');T.textContent='Error';L.textContent=j.error||'';B.classList.remove('ind');setTimeout(()=>t.classList.remove('show'),9000);return ask('Algo ha fallado',j.error||'Error desconocido','Cerrar',true);}
    await new Promise(r=>setTimeout(r,DEMO?150:600));
  }
}
function ask(title,msg,ok='Aceptar',single=false){
  return new Promise(res=>{
    $('#mT').textContent=title;$('#mB').textContent=msg;const f=$('#mF');f.innerHTML='';
    const done=v=>{$('#scrim').classList.remove('show');res(v);};
    if(!single){const c=document.createElement('button');c.className='btn';c.textContent='Cancelar';c.onclick=()=>done(false);f.append(c);}
    const o=document.createElement('button');o.className='btn pri';o.textContent=ok;o.onclick=()=>done(true);f.append(o);$('#scrim').classList.add('show');
  });
}

/* ───────── lista + filtros ───────── */
function flagsOf(r){
  const out=[];
  (r.flags||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(f=>{
    if(f.startsWith('DUPLICADO'))out.push({k:'bad',t:'Posible duplicado. '+f.replace('DUPLICADO:','').trim()});
    else if(f.startsWith('Live Mashup'))out.push({k:'good',t:'Live Mashup: se aplica la regla fija (MOE de 4 u 8 compases + Aca Out).'});
    else if(f.startsWith('barras dudosas'))out.push({k:'warn',t:'Compases dudosos '+f.replace('barras dudosas','').trim()+'. Escucha el corte y confírmalo.'});
    else if(f.startsWith('tipo dudoso'))out.push({k:'warn',t:'Tipo dudoso '+f.replace('tipo dudoso','').trim()+'. Revisa MOE / POE / FME.'});
    else if(f.includes('Aca Out?'))out.push({k:'warn',t:'¿Tiene Aca Out? Comprueba el final de la pista.'});
    else if(f.includes('Aca Starter?'))out.push({k:'warn',t:'¿Empieza en acapella? Escucha el inicio.'});
    else if(f.includes('Short Edit?'))out.push({k:'warn',t:'¿Es un Short Edit? Comprúebalo.'});
    else if(f.includes('In Aca')||f.includes('In Hype'))out.push({k:'warn',t:f});
    else if(f.startsWith('START MIX propuesto'))out.push({k:'info',t:f+'. Ajústalo sobre la onda si no cuadra.'});
    else if(f.includes('sacados del NOMBRE'))out.push({k:'warn',t:'BPM y tono sacados del nombre del archivo, no de Mixed In Key. Pásala por Mixed In Key para fiarte.'});
    else if(f.startsWith('BPM de Mixed In Key'))out.push({k:'warn',t:f});
    else if(f.startsWith('Título con'))out.push({k:'info',t:'Título con "x": se ha puesto (Mashup) automáticamente.'});
    else if(f.startsWith('sin BPM'))out.push({k:'bad',t:'Sin BPM/tono: pasa antes la pista por Mixed In Key.'});
    else if(f.startsWith('trae "Mashup"'))out.push({k:'info',t:'El nombre trae "Mashup": ¿quieres (Mashup)?'});
    else out.push({k:'info',t:f});
  });
  return out;
}
const isDoubt=r=>r.confidence<0.6||flagsOf(r).some(f=>f.k==='warn');
function chipsHTML(r){
  const p=r.p,c=[]; if(p.aca_starter)c.push('<span class="chip c-bars">ACA START</span>'); else if(p.bars)c.push(`<span class="chip c-bars">${p.bars} BARS</span>`);
  if(p.type&&!p.aca_starter)c.push(`<span class="chip c-${p.type}">${p.type}</span>`);
  if(p.mashup)c.push('<span class="chip c-tag">MASHUP</span>'); if(r.original.toLowerCase().includes('live mashup'))c.push('<span class="chip c-info">LIVE</span>');
  if(p.after)c.push(`<span class="chip c-tag">${p.after.toUpperCase()}</span>`); if(p.short_edit)c.push('<span class="chip c-tag">SHORT</span>'); if(p.open_show)c.push('<span class="chip c-tag">OPEN SHOW</span>'); if(p.aca_out)c.push('<span class="chip c-tag">ACA OUT</span>');
  if(r.dup)c.push('<span class="chip c-dup">DUPLICADO</span>'); else if(isDoubt(r)&&!r.reviewed)c.push('<span class="chip c-warn">REVISAR</span>');
  const mk=S.marks[r.original]; if(mk&&mk.start!=null)c.push('<span class="chip c-info">MIX</span>');
  return c.join('');
}
function cardHTML(r,i){
  const kb=keyBadge(r.p.key),conf=r.confidence,col=conf>=.75?'#34d399':conf>=.55?'#fbbf24':'#f87171';
  const artist=r.artist||'<span style="opacity:.5">sin artista</span>';
  return `<div class="card ${i===S.sel?'sel':''} ${r.checked?'':'off'}" data-i="${i}">
    <div class="chk ${r.checked?'on':''}" data-chk="${i}">${r.checked?'✓':''}</div>
    <div class="key" style="background:${kb.bg}">${kb.t}<small>${r.p.bpm?Math.round(r.p.bpm)+' BPM':''}</small></div>
    <div style="min-width:0" title="${esc(r.final||'')}"><div class="ttl">${r.p.key&&r.p.bpm?previewHTML(r):esc(r.final||r.p.base||r.original)}${(r.final&&r.proposed&&r.final!==r.proposed)?' <span class="chip c-tag" style="margin-left:6px">EDITADA</span>':''}</div><div class="sub">${r.artist?esc(r.artist):artist}</div></div>
    <div class="chips">${chipsHTML(r)}</div>
    <div class="ring" style="background:conic-gradient(${col} ${Math.round(conf*360)}deg,rgba(255,255,255,.1) 0)"><span>${Math.round(conf*100)}</span></div>
    ${r.reviewed?'<i class="seen"></i>':''}</div>`;
}
function visible(){
  const q=S.q.trim().toLowerCase();
  return S.rows.map((r,i)=>[r,i]).filter(([r])=>{
    if(q&&!(r.original+' '+r.artist+' '+r.final).toLowerCase().includes(q))return false;
    return S.filter==='all'||(S.filter==='doubt'&&isDoubt(r)&&!r.reviewed)||(S.filter==='dup'&&r.dup)||(S.filter==='seen'&&r.reviewed)||(S.filter==='off'&&!r.checked);
  });
}
function renderFilters(){
  const n=S.rows.length,c={all:n,doubt:S.rows.filter(r=>isDoubt(r)&&!r.reviewed).length,dup:S.rows.filter(r=>r.dup).length,seen:S.rows.filter(r=>r.reviewed).length,off:S.rows.filter(r=>!r.checked).length};
  const L={all:'Todas',doubt:'Por revisar',dup:'Duplicadas',seen:'Vistas',off:'Off'};
  $('#filters').innerHTML=Object.keys(L).map(k=>`<button class="pill ${S.filter===k?'on':''}" data-f="${k}">${L[k]}<b>${c[k]}</b></button>`).join('')+`<input class="search" id="q" placeholder="Buscar…" value="${esc(S.q)}">`;
  const q=$('#q');q.oninput=()=>{S.q=q.value;renderList();};
  const nv=visible().length;
  $('#bulk').innerHTML=`<button class="pill" data-bulk="on" title="Marca con ✓ todas las pistas que ves ahora (usa el filtro Off o Duplicadas)">☑ Marcar visibles<b>${nv}</b></button><button class="pill" data-bulk="off">☐ Desmarcar visibles</button><button class="pill" data-bulk="nodup" title="Marca todas menos las duplicadas">☑ Todas menos duplicadas</button>`;
}
function bulk(m){
  if(m==='nodup')S.rows.forEach(r=>{r.checked=!r.dup;});else visible().forEach(([r])=>{r.checked=(m==='on');});
  renderFilters();renderList();queueSave();
}
function renderList(){
  const v=visible(); const el=$('#list');
  el.innerHTML=v.length?v.map(([r,i])=>cardHTML(r,i)).join(''):`<div class="empty" style="margin:auto"><p>${S.rows.length?'Nada con este filtro.':'Aquí aparecerán tus pistas.'}</p></div>`;
}
function patchCard(i){const old=$(`.card[data-i="${i}"]`);if(old){const t=document.createElement('div');t.innerHTML=cardHTML(S.rows[i],i);old.replaceWith(t.firstElementChild);}renderFilters();}

/* ───────── inspector ───────── */
const CATS=[['Pink','FF007F'],['Review','FF0000'],['Build Up','FFA500'],['Warm Up','FFFF00'],['Peak Time','00FF00'],['Chill Out','25FDE9'],['Samples','0000FF'],['Closing','660099']];
function renderInsp(){
  const el=$('#insp');
  if(!S.rows.length&&S.done.apply){
    el.innerHTML=`<div class="empty"><div style="font-size:54px;margin-bottom:12px">✅</div><h2>Tanda terminada</h2><p>${S.done.cues?'Nombres, tags y cues listos. Ahora impórtalos en Rekordbox con djflow_cues.xml (visor «rekordbox xml» › djflow) y arrástralos a tu colección.':'Nombres y tags aplicados.'}<br><br>Si algo no te convence, puedes deshacer la tanda con ↶ (arriba).</p><button class="btn pri" id="eNew">Otra carpeta</button></div>`;$('#eNew').onclick=()=>{S.done={apply:false,cues:false};render();chooseFolder();};return;
  }
  if(!S.rows.length){
    const has=S.cfg.folder;
    el.innerHTML=`<div class="empty"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><h2>Prepara tu música antes de Rekordbox</h2>
      <p>Elige la carpeta con las canciones nuevas (ya pasadas por Mixed In Key). Dmzeta Workflow propone el nombre, los compases, los cues y el grid, tú lo revisas escuchando la onda.</p>
      <button class="btn pri" id="eChoose">Elegir carpeta</button>${has?`<button class="btn" id="eCont">Continuar con ${esc(has.split('/').pop())}</button>`:''}
      <div class="mini">Atajos: Espacio reproducir · ↑↓ cambiar de pista · S / E / L marcar START MIX, END MIX y loop</div></div>`;
    $('#eChoose').onclick=chooseFolder; const c=$('#eCont'); if(c)c.onclick=()=>loadReview(S.cfg.folder); return;
  }
  const r=S.rows[S.sel];
  if(!r){el.innerHTML=`<div class="empty"><h2>Selecciona una pista</h2><p>Haz clic en una tarjeta para revisarla. Si está desmarcada (☐) no se renombrará.</p></div>`;return;}
  const p=r.p,fl=flagsOf(r),T=(k,l,on)=>`<button class="tgb ${on?'on':''}" data-t="${k}">${l}</button>`;
  const bars=[4,8,16,24,32].map(b=>`<button data-b="${b}" class="${p.bars===b&&!p.aca_starter?'on':''}">${b}</button>`).join('');
  const types=['MOE','POE','FME'].map(t=>`<button data-v="${t}" data-ty="${t}" class="${p.type===t&&!p.aca_starter?'on':''}">${t}</button>`).join('');
  el.innerHTML=`
   <div><div class="lbl">Título</div><input class="fld big" id="fBase" value="${esc(p.base)}" spellcheck="false"><div class="orig" title="${esc(r.original)}">Original · ${esc(r.original)}</div></div>
   <div class="row2"><div><div class="lbl">Artista(s) · separados por comas</div><input class="fld" id="fArt" value="${esc(r.artist)}" spellcheck="false"></div>
     <div class="row2" style="gap:10px"><div><div class="lbl">Tono</div><input class="fld" id="fKey" value="${esc(p.key||'')}" maxlength="3" style="text-transform:uppercase"></div><div><div class="lbl">BPM</div><input class="fld" id="fBpm" value="${p.bpm||''}" inputmode="numeric"></div></div></div>
   <div><div class="lbl">Nombre final · puedes editarlo a mano</div><div class="preview" id="fPrev">${previewHTML(r)}</div><input class="fld" id="fFinal" value="${esc(r.final)}" spellcheck="false" style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></div>
   <div class="row2"><div><div class="lbl">Extended (compases y tipo)</div><div class="seg" id="sBars">${bars}</div></div><div><div class="lbl">Tipo</div><div class="seg t" id="sTy">${types}</div></div></div>

function selectRow(i,load=true){if(i<0||i>=S.rows.length||i===S.sel&&load===false)return;S.sel=i;$$('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.i===i));renderInsp();if(load)loadTrack(i);const el=$(`.card[data-i="${i}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});}
function stepSel(d){const v=visible().map(x=>x[1]);if(!v.length)return;const k=v.indexOf(S.sel);selectRow(v[Math.max(0,Math.min(v.length-1,k<0?0:k+d))]);}
window.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)){if(e.key==='Escape')e.target.blur();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k===' '){e.preventDefault();togglePlay();}else if(k==='ArrowDown'){e.preventDefault();stepSel(1);}else if(k==='ArrowUp'){e.preventDefault();stepSel(-1);}
  else if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();const sg=k==='ArrowRight'?1:-1;seek(D.q?snap(curPos()+sg*(e.shiftKey?4:1)*barLen()):curPos()+sg*(e.shiftKey?1:.1));}else if(k==='q'||k==='Q'){$('#tQ').click();}else if(k==='k'||k==='K'){setCuePt();}else if(k==='n'||k==='N'){addMem();}else if(/^Digit[1-8]$/.test(e.code)){padAct(String.fromCharCode(64+ +e.code.slice(5)),e.shiftKey);}else if(k==='j'||k==='J'){goCuePt();}else if(k==='g'||k==='G'){gridHere();}
  else if(k==='s'||k==='S')markHere('start');else if(k==='e'||k==='E')markHere('end');else if(k==='l'||k==='L')markHere('loop');else if(k==='x'||k==='X')markHere('clear');
  else if(k==='['){nudge('beat',-1);}else if(k===']'){nudge('beat',1);}else if(k===','){nudge('ms',-stepMs());}else if(k==='.'){nudge('ms',stepMs());}
  else if(k==='m'||k==='M'){$('#tClk').click();}else if(k==='+'||k==='='){zoom(.6);}else if(k==='-'){zoom(1.7);}
  else if(k==='Enter'&&S.sel>=0){acceptNext();}else if((k==='c'||k==='C')&&S.sel>=0){setChecked(S.sel,!S.rows[S.sel].checked);}
});

function synthBuffer(bpm=100,secs=150,K=40){
  const ctx=AC(),sr=22050,buf=ctx.createBuffer(1,sr*secs,sr),d=buf.getChannelData(0),beat=60/bpm,bar=beat*4;let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647-.5;};
  for(let t=0.05;t<secs-.4;t+=beat){const loud=(t-.05)/bar>=K,intro=(t-.05)/bar<8,i=Math.floor(t*sr),g=loud?.95:intro?.35:.6;
    for(let j=0;j<.12*sr;j++){const tt=j/sr;d[i+j]+=Math.sin(2*Math.PI*(55+120*Math.exp(-tt*40))*tt)*Math.exp(-tt*25)*g;}
    if(!intro||loud){const h=Math.floor((t+beat/2)*sr);for(let j=0;j<.03*sr;j++)d[h+j]+=rnd()*Math.exp(-j/(.006*sr))*(loud?.5:.25);}
    if(loud)for(let j=0;j<beat*sr;j++)d[i+j]+=Math.sin(2*Math.PI*110*j/sr)*.22*Math.exp(-j/(beat*sr*.8));}
  return buf;
}
